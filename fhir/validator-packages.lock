# Packages the official HL7 validator resolves on its own, beyond the four -ig files that
# Dockerfile.validator downloads and names. Without this list the validator fetched every one of
# them from the FHIR package registry on each start — in the deployed sidecar, on every cold start
# (measured 2026-09-21: about 45 of the worker's 57 seconds to ready) — so what it validated
# against was whatever the registry served that day, and it could not start without it.
#
# One list, three readers: Dockerfile.validator installs these into the image's package cache at
# build time, scripts/ci/official-validate.mjs seeds the CI gate's cache from them, and both then
# run the validator with no network route, so an unlisted dependency fails loudly instead of
# being fetched.
#
# Each line: <package id> <version> <sha256 of the tarball served at
# https://packages2.fhir.org/packages/<id>/<version>>. Measured 2026-09-21 by running the pinned
# validator with the gate's exact flags in an empty cache and recording every package it
# installed; every content file of each tarball below is byte-identical to what the validator
# installed from the network (only its own .index.json files differ, which it regenerates).
