<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The renderer gate's only fontconfig (docs/design/authority-import-renderer.md, R6): the pinned
  font directory and nothing else, the family bindings the gate states, and no hinting, sub-pixel
  order or embedded bitmaps. Each binding is read back from a drawn page by the image's smoke
  check; a family bound here to no pinned face is refused by the judge (`font-unpinned`).
-->
<fontconfig>
  <dir>/opt/renderer/fonts</dir>
  <cachedir>/tmp/cache/fontconfig</cachedir>

  <alias binding="strong"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>Times</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="strong"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
