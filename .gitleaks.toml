# This repository's exceptions to the secret scan (scripts/ci/secret-scan.sh; docs/foundations.md,
# D4), and nothing else: [[allowlists]] tables only.
#
# The scan appends them to gitleaks' own default configuration for its pinned version, fetched
# and checksummed like the binary, with that configuration's global path exemptions dropped. So
# every default rule applies, to every file, and this file is not a configuration on its own (no
# `[extend] useDefault`: that would bring the path exemptions back).
#
# An exception here must be as narrow as the false positive it covers: one rule, one file, one
# line shape, all three required (condition AND), with the reason. A path-only or rule-only
# exception would also hide a real secret added beside it.

# deploy.sh authenticates to Artifact Registry's Docker v2 API with HTTP Basic, the fixed user
# `oauth2accesstoken` and a freshly minted access token as the password. The line carries a
# command substitution, never a credential; curl-auth-user matches the `--user name:value` shape.
[[allowlists]]
description = "deploy.sh: Artifact Registry basic auth with a token minted at run time"
condition = "AND"
targetRules = ["curl-auth-user"]
paths = ['''^scripts/gcp/deploy\.sh$''']
# The rule's captured secret, exactly: the user name and the command substitution, quotes included.
regexTarget = "secret"
regexes = ['''^"oauth2accesstoken:\$\(ema_flow_access_token\)"$''']

# test/ci/operator-arguments.test.ts, as committed in c7c96d6 of the B08 follow-up (PR #143): a
# fake `--token=` argument, base64 of the letters A to Z, proving a refused argument is never
# echoed. It stays in that commit's history; the test now builds its fakes at run time.
[[allowlists]]
description = "operator-arguments.test.ts (c7c96d6): base64 of A-Z as a fake refused token"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^test/ci/operator-arguments\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo=$''']

# fhir/mappings/cap-smpc-en.json: each rule's `sourceKey`, a canonical SmPC section key such as
# `smpc.4.2.posology.paediatric` (mapping 1.4.0). generic-api-key takes a JSON key ending in "key"
# with a long value for a credential; these values are dotted lower-case section names.
[[allowlists]]
description = "cap-smpc-en.json: canonical section keys under sourceKey"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^fhir/mappings/cap-smpc-en\.json$''']
regexTarget = "secret"
regexes = ['''^smpc(?:\.[0-9a-z-]+)+$''']
