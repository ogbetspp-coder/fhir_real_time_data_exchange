options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
  substitutionOption: MUST_MATCH

substitutions:
  _REGION: europe-west4
  _REPOSITORY: ema-flow
  _IMAGE_TAG: manual

steps:
  - id: install
    name: node:22.14.0-bookworm-slim
    entrypoint: sh
    args:
      - -c
      - >-
        if [ -f package-lock.json ]; then
        npm ci --no-audit --no-fund;
        else
        npm install --no-audit --no-fund;
        fi

  - id: standards-integrity
    name: node:22.14.0-bookworm-slim
    entrypoint: npm
    args: ["run", "standards:fetch"]
    waitFor: ["install"]

  - id: quality-gate
    name: node:22.14.0-bookworm-slim
    entrypoint: npm
    args: ["run", "check"]
    waitFor: ["install"]

  - id: build
    name: node:22.14.0-bookworm-slim
    entrypoint: npm
    args: ["run", "build"]
    waitFor: ["quality-gate"]

  - id: terraform-format
    name: hashicorp/terraform:1.16.3
    args: ["-chdir=infra", "fmt", "-check", "-recursive"]

  - id: terraform-init
    name: hashicorp/terraform:1.16.3
    args: ["-chdir=infra", "init", "-backend=false"]
    waitFor: ["terraform-format"]

  - id: terraform-validate
    name: hashicorp/terraform:1.16.3
    args: ["-chdir=infra", "validate"]
    waitFor: ["terraform-init"]

  - id: build-app-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/worker:${_IMAGE_TAG}
      - .
    waitFor: ["build", "terraform-validate", "standards-integrity"]

  - id: build-validator-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - Dockerfile.validator
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/validator:${_IMAGE_TAG}
      - .
    waitFor: ["terraform-validate", "standards-integrity"]

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/worker:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/validator:${_IMAGE_TAG}
