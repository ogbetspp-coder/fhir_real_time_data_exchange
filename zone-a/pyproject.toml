[project]
name = "zone-a"
version = "0.1.0"
description = "Zone A: contract models, cross-language canonical-hash parity and the fidelity check against the golden vectors; the QRD template registry and the QRD conformance check, over labels read by the label reader"
readme = "README.md"
# ADR 0003 pins the Unicode Character Database, not just the language version: NFC output
# depends on it. 3.14.x ships Unicode 16.0.0, the same version as the Zone B runtime image
# (node:22.22.0, ICU 77.1). A different minor Python is a different UCD, so the range is closed.
requires-python = ">=3.14,<3.15"
# label-docx is the label reader in this repository (label-docx-reader/, no runtime dependencies of
# its own), read from its source tree: zone-a's reads of a .docx and an ePI are its certified ones.
dependencies = ["label-docx", "pydantic==2.13.5"]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.83.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.10",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv]
# The build backend and its whole closure, pinned (audit B07, S-5). `uv sync` builds this project
# with hatchling, and hatchling's own dependencies were resolved afresh on every sync, unpinned:
# a new release of any of them reached CI and every developer's machine with no review. uv takes
# no hashes for build dependencies in project mode, so these are exact versions, checked against
# the index's hashes as they download; test/ci/python-build-pins.test.ts holds the hatchling pin
# equal to [build-system] and the list to hatchling's dependencies. A Dependabot move of
# [build-system] fails `uv sync` until this list moves with it (then `uv lock`).
build-constraint-dependencies = [
  "hatchling==1.32.4",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.9.21.13",
]

[tool.uv.sources]
label-docx = { path = "../label-docx-reader", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/zone_a"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py314"

[tool.ruff.format]
# A magic trailing comma is what makes model generation non-reproducible: datamodel-code-generator
# emits one only when its own (undeclared) width estimate wraps a call, so the committed module
# and the --check regeneration could differ by nothing but a comma. Collapsing is deterministic.
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
# Paired with format.skip-magic-trailing-comma above; ruff warns if the two disagree.
split-on-trailing-comma = false

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "PIE",
  "PT",
  "RET",
  "SIM",
  "ARG",
  "PTH",
  "ERA",
  "RUF",
  # Google Python Style Guide (docs/python-style.md): no assert outside tests (it
  # is stripped under -O), no blind except, pylint's error and warning checks, and Google
  # docstrings.
  "S101",
  "BLE",
  "PLE",
  "PLW",
  "PLC1802",
  "D",
]
# An __init__ is documented in its class's docstring (Google style).
ignore = ["D107"]

# T201 (print) is deliberately NOT selected globally: scripts/ print progress. Tests are
# forbidden from printing by test_no_narrative_leak.py, which is a stronger, targeted check.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Generated models: datamodel-code-generator owns the formatting and the field names.
"src/zone_a/contracts/*.py" = [
  "A003", "D", "E501", "ERA001", "I001", "N805", "N815", "RUF012", "UP",
]
# Tests assert (pytest), and a test's name is its documentation.
"tests/*.py" = ["S101", "D"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# The label reader (label-docx-reader/) is typed and passes mypy --strict on its own, but ships no
# py.typed marker: adding one changes its source tree, which its mutation record hashes whole
# (scripts/mutate_checker.py). Follow its imports as typed instead.
module = ["label_docx", "label_docx.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
# Generated code: checked, but datamodel-code-generator emits no docstrings for fields and
# pydantic's plugin covers the model semantics.
module = "zone_a.contracts.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

# Line coverage of the package, enforced in CI by `uv run --frozen pytest --cov` (the Zone A job in
# .github/workflows/ci.yml, and scripts/check-all.sh), as the agent's is. Not in addopts, so
# running one test file locally does not fail on the floor. Until audit B15 Zone A had none. The
# floor is the coverage measured on 2026-09-28 (97.88%, over the committed smoke corpus), rounded
# down: raise it when coverage rises, never lower it to let a change through.
[tool.coverage.run]
source = ["zone_a"]

[tool.coverage.report]
fail_under = 97
precision = 2
show_missing = true
skip_covered = true
