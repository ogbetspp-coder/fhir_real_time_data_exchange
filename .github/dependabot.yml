# Every dependency in this repository is pinned — actions by commit, images by digest, npm and
# Python by lock file, Terraform providers by lock file. A pin without an update path rots
# (docs/foundations.md, finding C3). Dependabot proposes each move as a pull request, where it
# must pass the same six required checks as any other change; nothing updates on its own.
#
# Weekly and grouped, so the proposals arrive as one reviewable pull request per ecosystem
# rather than one per package.
#
# Minor and patch versions only. A major version is a change to review deliberately — its
# release notes read, its migration done — not a routine bump that happens to pass the gates.
# The first run, on 2026-09-21, proposed TypeScript 6 to 7, three Actions majors, and Node 22 to
# 26 in every image, all at once and all but TypeScript green.
#
# The majors ignored, and what each waits for (recorded 2026-09-28, audit B07, S-2; the pin-freshness
# workflow reports the pins Dependabot does not read at all):
#   - actions/checkout v5 -> v7, actions/setup-node v5 -> v7, astral-sh/setup-uv v7 -> v10: read
#     each release's breaking changes against the steps that use it (checkout's credential and
#     depth handling, setup-node's cache defaults, setup-uv's cache and version inputs), then move
#     all workflows at once; test/ci/deploy-permissions.test.ts holds the checkout settings.
#   - typescript 6 -> 7: blocked by typescript-eslint 8.x, whose peer range is <6.1.0.
#   - @types/node: pinned to the runtime's major (~22) on purpose, not by this rule; it moves with
#     Node, under ADR 0003.
#   - Transitive majors, not pinned here and held by the ranges of the packages that require them:
#     mcp 1 -> 2 (google-adk 2.9.2 requires mcp<2), websockets 15 -> 17 and multidict 6 -> 7
#     (agent), isort 8 -> 9 (Zone A). They move when those packages allow it.
#   - No other direct major was open on 2026-09-28.
#
# The Node base image moves by digest only, never by version. The worker's and the query
# service's runtime is debian:bookworm-slim by digest, with the pinned Node binary copied in
# (Dockerfile, audit B07, S-1): that digest moves weekly here, so the operating system is
# refreshed while Node, its ICU and its Unicode stay put. ADR 0003 pins the runtime to
# node:22.22.0 because NFC — step 3 of the fidelity normalisation — depends on the runtime's
# Unicode tables, and a different Node can change every NFC-dependent hash. CI would not have
# noticed: it tests on its own Node install, not the one inside the image. Moving it is a change
# under ADR 0003's change control; test/ci/runtime-pin.test.ts fails if any image or workflow
# drifts from the version the ADR names.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /agent
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      agent:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /zone-a
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      zone-a:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      terraform:
        patterns: ["*"]
