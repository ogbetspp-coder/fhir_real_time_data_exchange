name: Deploy to Google Cloud

on:
  push:
    branches:
      - main
    # A merge that touches only these cannot change what is deployed, so it does not deploy:
    # every deploy rebuilds three images, re-imports the profiles and publishes a smoke run, and
    # 41 of them ran in two days, most for documentation. Nothing deployed is built from these
    # paths — the images take src/, fhir/, package files and Dockerfiles; the deploy takes infra/,
    # scripts/ and workflows/. The quality gate on the pull request still covers test/. qrd/
    # holds the pinned EMA templates and the registry built from them, and labels/ the pinned EMA ePIs
    # and their conformance results; both are read only by zone-a/.
    # .claude/ and .cursor/ hold coding-assistant settings and hooks, read by editors on a
    # developer's machine and never by a build or the deploy.
    # workflow_dispatch below deploys on demand whatever changed.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "test/**"
      - "agent/**"
      - "zone-a/**"
      - "qrd/**"
      - "labels/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/plan.yml"
      - ".github/workflows/vulnerabilities.yml"
      - "osv-scanner.toml"
      - ".gitleaks.toml"
      - ".claude/**"
      - ".cursor/**"
  workflow_dispatch:

# Nothing at the workflow level: each job names what it needs. A job granted id-token: write
# can ask GitHub for an OIDC token that Workload Identity Federation exchanges for the deployer,
# and every process in that job can make the request (ACTIONS_ID_TOKEN_REQUEST_URL and _TOKEN
# are in its environment) whether or not an auth step has run yet. So the quality gate, which
# installs the whole dependency tree with its install scripts and runs every test, lint and
# build tool in it, runs in a job that cannot ask (repository review, 2026-09-22).
permissions: {}

concurrency:
  group: deploy-google-cloud
  cancel-in-progress: false

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history for the importer lock's test (scripts/ci/lock-base.sh).
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      # npm ci directly, not deploy.sh deps: the script resolves a project id before any phase,
      # and this job has neither the project variables nor a gcloud configuration.
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      # The importer lock's base (scripts/ci/lock-base.sh): the commit before this push, or main
      # for a manual run, whose history test/authority/lock.test.ts reads as released.
      - name: Name the importer lock's base
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci/lock-base.sh

      - name: Quality gate
        run: npm run check

  # A failed gate leaves the same kind of issue a failed deploy does (foundations C11), from a
  # job that checks nothing out, installs nothing and holds only the right to open an issue.
  gate-failure:
    name: Report a failed quality gate
    needs: gate
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open a deploy-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create \
            --title "deploy-failure ${{ github.run_id }}" \
            --body "Actions run: ${run_url}

          The quality gate failed, so nothing was deployed. The job log has the failing check."

  deploy:
    name: Deploy
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      issues: write
    timeout-minutes: 90
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      # The environment's own inputs (the query service's refusal-reason logging, synthetic
      # sources) are in scripts/gcp/environments/dev.env, which deploy.sh reads for the plan and
      # the deploy alike; they are not set here (test/ci/environment-inputs.test.ts).
      EMA_FLOW_ENVIRONMENT: dev
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"

    steps:
      - name: Check deployment configuration
        env:
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          QUERY_INVOKERS: ${{ vars.QUERY_INVOKERS }}
          QUERY_TOKEN_CREATORS: ${{ vars.QUERY_TOKEN_CREATORS }}
          QUERY_ENTITLEMENTS_JSON: ${{ vars.QUERY_ENTITLEMENTS_JSON }}
          QUERY_OAUTH_CLIENT_IDS: ${{ vars.QUERY_OAUTH_CLIENT_IDS }}
          ALERT_NOTIFICATION_EMAIL: ${{ vars.ALERT_NOTIFICATION_EMAIL }}
          ALERT_NOTIFICATION_CHANNELS: ${{ vars.ALERT_NOTIFICATION_CHANNELS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_DEPLOY_SERVICE_ACCOUNT GCP_WORKLOAD_IDENTITY_PROVIDER; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required repository variable ${name} is not configured." >&2
              exit 1
            fi
            echo "Repository variable ${name} is present."
          done
          # Who every alert pages (an encryption key made unavailable, a failed run, entitlement
          # probing). Dev need not have anyone yet (owner decision, 2026-09-28): its alert
          # policies are created but page no one, and the apply below is not given these two
          # variables, so a value left in either is ignored (scripts/gcp/environments/dev.env).
          # Every other environment requires one or the other, and without either its apply is
          # refused.
          if [[ "$EMA_FLOW_ENVIRONMENT" == "dev" ]]; then
            if [[ -n "${ALERT_NOTIFICATION_EMAIL:-}${ALERT_NOTIFICATION_CHANNELS:-}" ]]; then
              echo "::notice title=Alert variables ignored::dev pages no one; ALERT_NOTIFICATION_EMAIL and ALERT_NOTIFICATION_CHANNELS are not passed to its deploy."
            fi
            echo "dev: no alert recipient is required; its alerts page no one."
          elif [[ -z "${ALERT_NOTIFICATION_EMAIL:-}" && -z "${ALERT_NOTIFICATION_CHANNELS:-}" ]]; then
            echo "Required repository variable ALERT_NOTIFICATION_EMAIL (or ALERT_NOTIFICATION_CHANNELS) is not configured: every alert must page someone." >&2
            exit 1
          else
            echo "An alert recipient is configured."
          fi
          # Optional. Unset means the Terraform default for that variable, which for the query
          # service is no invoker, no token creator on the caller service account, no
          # entitlement, and no accepted OAuth client id: the service deploys and its startup
          # probe passes, and no caller is authorised.
          for name in QUERY_INVOKERS QUERY_TOKEN_CREATORS QUERY_ENTITLEMENTS_JSON QUERY_OAUTH_CLIENT_IDS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Optional repository variable ${name} is not set; the Terraform default applies."
            else
              echo "Optional repository variable ${name} is present."
            fi
          done

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false

      # The deploy still runs Node: bootstrap.sh fetches the pinned standards and exports the
      # fixture with tsx. It needs the packages, not their install scripts, and in this job an
      # install script could ask for the deployer's token. The gate job above has already run
      # the same lock file with scripts on and proved the tree works.
      - name: Install Node dependencies without install scripts
        env:
          npm_config_ignore_scripts: "true"
        run: bash scripts/gcp/deploy.sh deps 2>&1 | tee -a deploy-run.log

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Preflight
        run: bash scripts/gcp/deploy.sh preflight 2>&1 | tee -a deploy-run.log

      - name: Terraform init
        run: bash scripts/gcp/deploy.sh init 2>&1 | tee -a deploy-run.log

      - name: Enable APIs and Artifact Registry
        run: bash scripts/gcp/deploy.sh apis 2>&1 | tee -a deploy-run.log

      - name: Build container images
        run: bash scripts/gcp/deploy.sh images 2>&1 | tee -a deploy-run.log

      # Repository variables, not secrets. QUERY_INVOKERS and QUERY_TOKEN_CREATORS hold IAM
      # member strings, the entitlement map holds opaque subject ids and FHIR bundle ids, and
      # QUERY_OAUTH_CLIENT_IDS holds OAuth client ids: none of these is a credential, and
      # holding one proves nothing and grants nothing. Each query variable is optional; unset
      # leaves the Terraform default (no invoker, no token creator, no entitlement, no accepted
      # OAuth client id). The alert recipient is not, outside dev: the apply refuses to run
      # without one. Dev is given none (owner decision, 2026-09-28): its alerts page no one, and a
      # value left in either alert variable is ignored rather than refused as a placeholder.
      # .github/workflows/plan.yml passes every one of these too (test/ci/environment-inputs.test.ts).
      - name: Apply infrastructure
        env:
          QUERY_INVOKERS: ${{ vars.QUERY_INVOKERS }}
          QUERY_TOKEN_CREATORS: ${{ vars.QUERY_TOKEN_CREATORS }}
          QUERY_ENTITLEMENTS_JSON: ${{ vars.QUERY_ENTITLEMENTS_JSON }}
          QUERY_OAUTH_CLIENT_IDS: ${{ vars.QUERY_OAUTH_CLIENT_IDS }}
          ALERT_NOTIFICATION_EMAIL: ${{ env.EMA_FLOW_ENVIRONMENT != 'dev' && vars.ALERT_NOTIFICATION_EMAIL || '' }}
          ALERT_NOTIFICATION_CHANNELS: ${{ env.EMA_FLOW_ENVIRONMENT != 'dev' && vars.ALERT_NOTIFICATION_CHANNELS || '' }}
        run: bash scripts/gcp/deploy.sh apply 2>&1 | tee -a deploy-run.log

      # Who may read the record (foundations C13): project viewers and editors lose the access
      # Cloud Storage and BigQuery give them by default, on every bucket and dataset this deploy
      # manages, including any created by the apply above.
      - name: Record readers
        run: bash scripts/gcp/deploy.sh record-readers 2>&1 | tee -a deploy-run.log

      - name: Reconcile FHIR stores
        run: bash scripts/gcp/deploy.sh bootstrap 2>&1 | tee -a deploy-run.log

      # The worker's own URL is the audience the next step mints a token for. Read from
      # Terraform rather than reconstructed, so a renamed or relocated service cannot leave the
      # audience silently pointing at a service that no longer answers.
      - name: Read the worker's URL
        id: worker
        run: |
          uri="$(terraform -chdir=infra output -raw cloud_run_service_uri)"
          echo "uri=${uri}" >>"$GITHUB_OUTPUT"

      # The deploy's own credential is an external account (Workload Identity Federation), and
      # gcloud will not mint an ID token from one. This step does it through the auth action
      # instead, which calls generateIdToken on the deployer service account — permitted by the
      # roles/iam.workloadIdentityUser binding the GitHub pool principal already holds, so no
      # new grant is needed. include_email is required: Cloud Run matches the IAM member by the
      # token's e-mail claim.
      - name: Mint an ID token for the worker
        id: worker_token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: false
          export_environment_variables: false
          token_format: id_token
          id_token_audience: ${{ steps.worker.outputs.uri }}
          id_token_include_email: true

      # The step that would have shown the pipeline had never completed a run: one fixture run
      # through the worker just deployed, as the deployer, which must answer 200 with status
      # "persisted". A 422 source-disabled (enabled_run_sources without fixture) skips with a
      # notice. Only closed fields of the answer reach the log.
      - name: Smoke run through the deployed worker
        env:
          WORKER_ID_TOKEN: ${{ steps.worker_token.outputs.id_token }}
        run: bash scripts/gcp/deploy.sh smoke 2>&1 | tee -a deploy-run.log

      # The query service's URL, read from Terraform like the worker's above. The next step mints
      # a token for it that only gets a request past Cloud Run's edge.
      - name: Read the query service's URL
        id: query
        run: |
          uri="$(terraform -chdir=infra output -raw query_service_url)"
          echo "uri=${uri}" >>"$GITHUB_OUTPUT"

      # The deployer may invoke the query service through its project-level roles/run.admin (the
      # same entitlement the worker smoke uses). The token travels in X-Serverless-Authorization
      # only, never in Authorization, so the service itself sees a caller with no Bearer: it
      # authenticates nothing, and no entitlement or tool is involved.
      - name: Mint an ID token for the query service's edge
        id: query_token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: false
          export_environment_variables: false
          token_format: id_token
          id_token_audience: ${{ steps.query.outputs.uri }}
          id_token_include_email: true

      # Up, current and walled: Cloud Run reports this deploy's revision Ready; anonymous POST
      # /mcp and GET /readyz are refused at the edge; past the edge with no Bearer, /mcp is the
      # service's own 401 and /readyz names this commit. No tool is called: the authenticated
      # get_section / verify_quote smoke is still to come.
      - name: Smoke the deployed query service
        env:
          QUERY_EDGE_ID_TOKEN: ${{ steps.query_token.outputs.id_token }}
        run: bash scripts/gcp/deploy.sh query-smoke 2>&1 | tee -a deploy-run.log

      # A green deploy supersedes every earlier failure: close their issues, each with a pointer to
      # the run that superseded it, so an open deploy-failure issue always means a live failure
      # (foundations C11). Only issues this workflow opened, by title and author, are touched.
      - name: Close superseded failure issues
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue list --state open --author "app/github-actions" --search "deploy-failure in:title" \
            --limit 100 --json number,title --jq '.[] | select(.title | startswith("deploy-failure ")) | .number' |
            while read -r n; do
              gh issue close "$n" --comment "Superseded: deploy ${run_url} succeeded, smoke run included." || true
            done

      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path("deploy-run.log")
          text = log.read_text(errors="replace") if log.exists() else "deploy-run.log was not created"
          run_url = """${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"""
          body = f"Actions run: {run_url}\n\n```text\n{text[-50000:]}\n```\n"
          Path("issue.md").write_text(body, encoding="utf-8")
          PY
          gh issue create \
            --title "deploy-failure ${{ github.run_id }}" \
            --body-file issue.md
