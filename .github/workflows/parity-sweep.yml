name: Parity sweep

# The fidelity check's exhaustive parity sweep (audit 2026-09-27, F-4): the Python port against the
# TypeScript at every code point, as a character reference in `sup`, `sub` and after an inline
# tag, and raw in three normalisation contexts (scripts/fidelity/parity-sweep.ts,
# zone-a/tests/test_parity_sweep.py). It takes minutes, so it runs nightly and on demand rather
# than on every pull request, where the code point vectors and the differential corpus run.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: Parity sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
        working-directory: zone-a

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Unicode 16.0, as the Zone B runtime image: tests/test_environment.py asserts it.
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: zone-a/uv.lock

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Sweep every code point with the TypeScript implementation
        working-directory: .
        run: npx tsx scripts/fidelity/parity-sweep.ts --out parity-sweep.txt

      - name: Compare the Python port at every code point
        env:
          PARITY_SWEEP: ${{ github.workspace }}/parity-sweep.txt
        run: uv run --frozen pytest tests/test_parity_sweep.py tests/test_environment.py
