name: Vulnerabilities

# Known-vulnerability scan (docs/foundations.md, C1; scripts/ci/vuln-scan.sh). Fails on any known
# vulnerability in the npm or uv lockfiles; reports, without failing, what the pinned base images
# carry. Weekly as well as on every change: a new advisory is published without any commit, and
# the weekly run turns it into an issue.
#
# Secret scan (docs/foundations.md, D4; scripts/ci/secret-scan.sh), in the same required check:
# fails on any possible credential in the working tree or in the commits a pull request or a push
# adds; the weekly and manual runs scan the whole history. Its verdict is first proved on planted
# secrets (scripts/ci/secret-scan-selftest.sh), so a scan that would miss them cannot pass.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Read only at the workflow level. Only the weekly report job below may write an issue, and it
# checks nothing out: the scan job runs two downloaded scanners over every pull request's content.
permissions:
  contents: read

jobs:
  scan:
    name: Vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    # The two reports, base64 encoded so each is one line whatever it holds, for the weekly issue.
    outputs:
      vulnerabilities: ${{ steps.reports.outputs.vulnerabilities }}
      secrets: ${{ steps.reports.outputs.secrets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The secret scan reads the commits being added, not only the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan lockfiles and base images
        env:
          VULN_REPORT: ${{ runner.temp }}/vulnerabilities.md
        run: bash scripts/ci/vuln-scan.sh

      # Runs even when the vulnerability scan failed, so one finding never hides the other.
      - name: Prove the secret scan on planted secrets
        if: success() || failure()
        run: bash scripts/ci/secret-scan-selftest.sh

      - name: Scan for secrets
        if: success() || failure()
        env:
          SECRET_REPORT: ${{ runner.temp }}/secrets.md
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="${PUSH_AFTER}~1..${PUSH_AFTER}"
              else
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
            *) range="--all" ;;
          esac
          SECRET_SCAN_RANGE="$range" bash scripts/ci/secret-scan.sh

      - name: Publish the report
        id: reports
        if: always()
        env:
          REPORT: ${{ runner.temp }}/vulnerabilities.md
          SECRETS: ${{ runner.temp }}/secrets.md
        run: |
          [[ -f "$REPORT" ]] && cat "$REPORT" >>"$GITHUB_STEP_SUMMARY" || true
          [[ -f "$SECRETS" ]] && cat "$SECRETS" >>"$GITHUB_STEP_SUMMARY" || true
          {
            echo "vulnerabilities=$(base64 -w0 "$REPORT" 2>/dev/null || true)"
            echo "secrets=$(base64 -w0 "$SECRETS" 2>/dev/null || true)"
          } >>"$GITHUB_OUTPUT"

  # The one job that may write issues: on the weekly run only, after a failed scan, and with no
  # checkout, so no repository code or downloaded tool runs beside the token.
  report:
    name: Report a failed weekly scan
    needs: scan
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VULNERABILITIES: ${{ needs.scan.outputs.vulnerabilities }}
          SECRETS: ${{ needs.scan.outputs.secrets }}
        run: |
          {
            echo "The weekly scan found known vulnerabilities in a lockfile or a possible secret: ${RUN_URL}"
            echo
            base64 -d <<<"$VULNERABILITIES" || true
            base64 -d <<<"$SECRETS" || true
          } >"$RUNNER_TEMP/issue.md"
          gh issue create --title "vulnerabilities $(date -u +%Y-%m-%d)" --body-file "$RUNNER_TEMP/issue.md"
