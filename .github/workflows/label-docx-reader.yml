name: Label reader

# The label reader (label-docx-reader/), brought in with its history from its own repository,
# keeps its own gate: the five checks of its README's "Development", run only when it or this
# workflow changes. Its own label-docx-reader/.github/ is inert here; this file replaces it.
on:
  pull_request:
    paths:
      - "label-docx-reader/**"
      - ".github/workflows/label-docx-reader.yml"
  push:
    branches:
      - main
    paths:
      - "label-docx-reader/**"
      - ".github/workflows/label-docx-reader.yml"

permissions:
  contents: read

jobs:
  check:
    name: Label reader
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
        working-directory: label-docx-reader

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The Unicode database ships with the interpreter; tests/test_environment.py asserts it.
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: label-docx-reader/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Type-check
        run: uv run --frozen mypy --strict

      - name: Locks
        run: uv run --frozen python scripts/lock.py --check

      - name: Test
        run: uv run --frozen pytest --cov
