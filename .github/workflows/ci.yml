name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A pull request's newer push cancels its older run. Each push to main is a group of its own, by
# its commit: the deploy of each commit waits for CI's run on that commit to succeed
# (scripts/ci/workflow-runs.mjs, await-ci), and a shared group would let a third merge cancel the
# second's pending run even with cancel-in-progress off (a group holds one running and one
# pending run), refusing that deploy (review of audit B15).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      # Full history, so test/authority/lock.test.ts can read every importer version main has
      # released; no credentials kept, since npm ci below runs install scripts.
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund --engine-strict

      # The history test/authority/lock.test.ts reads as released: main's for a pull request, the
      # pre-push commit's for a push; an importer version never changes its code, data or vectors
      # once released (docs/design/authority-import-contract.md, D10).
      - name: Name the importer lock's base
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci/lock-base.sh

      # The test step of `npm run check` is `npm run test:coverage`: the suite under v8 coverage
      # with per-directory floors (vitest.config.ts), so a drop below a floor fails this job.
      - name: Run checks
        run: npm run check

      - name: Build
        run: npm run build

  # The official HL7 validator over the resources a fixture run and an authority import send it, and
  # the published ConceptMap and StructureMap (fhir/generated/), at the pins of
  # Dockerfile.validator (scripts/ci/official-validate.mjs reads the version, URLs, checksums
  # and flags from that file, so this job has no pin of its own). It is its own job rather than
  # part of `npm run check` because it needs a JVM and ~200 MB of downloads; the downloads are
  # cached by the Dockerfile's content, so a pin change is a cache miss and a checksum check.
  # A required check on main since 2026-09-21, and the deploy waits for it (with every job here).
  official-validation:
    name: Official validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Keyed by the Dockerfile and the package list. On a miss the cache is saved after this job's
      # own steps have run (npm ci with its install scripts, tsx), so nothing in it is trusted as
      # restored: the script re-hashes the jar and every tarball against its pinned checksum on
      # every run, re-downloading a stale or tampered one, and deletes the unpacked package cache
      # (home/, also inside this directory) and unpacks it afresh from the verified tarballs
      # (test/ci/official-validate.test.ts). There is no separate cache of ~/.fhir/packages any
      # more: that one was restored from any earlier key, so on a warm runner it hid every
      # download the validator made and could supply packages nobody had pinned.
      - name: Cache the validator and its packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/official-validator
          key: official-validator-${{ hashFiles('Dockerfile.validator', 'fhir/validator-packages.lock') }}

      - name: Validate the fixture, the authority import and fhir/generated against the official HL7 validator
        run: npm run validate:official

      # The deploy's inputs, made as the deploy's gate job makes them (scripts/gcp/deploy-inputs.sh):
      # the standards bootstrap imports, checked against fhir/standards.lock.json, and the synthetic
      # fixture, checked against its pin in fhir/deploy-inputs.lock.json. A change to the fixture's
      # code that does not update the pin fails here, before merge, rather than in the deploy.
      - name: Make the deploy's inputs and check them against their pins
        run: bash scripts/gcp/deploy-inputs.sh "${RUNNER_TEMP}/deploy-inputs" >/dev/null

  # The renderer gate's image (docs/design/authority-import-renderer.md, R1's pre-check and R6):
  # built from Dockerfile.renderer, every download checked against its pin and every library
  # Chrome links resolved, then run with no network, a read-only workspace and no credentials
  # (scripts/render/run.mjs), to prove the browser starts offline, loads both modes, fails every
  # request but the page's, and draws every family the fontconfig binds in the pinned face it
  # names. Its own job, since it needs Docker and ~200 MB of downloads; scripts/check-all.sh leaves
  # it out. A pull request that changes no renderer input (scripts/ci/renderer-inputs.mjs: only
  # documentation, the Python deployables, the infrastructure, assistant settings or Markdown)
  # skips the image and the checks, and the job passes, saying so on its summary (a rename counts
  # at both its paths); a push to main always runs them. A required check on main since
  # 2026-09-28, and the deploy waits for it.
  renderer:
    name: Renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      # The merge commit and its parents, so the change can be read against its base.
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Name whether a renderer input changed
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/renderer-inputs.mjs >> "$GITHUB_OUTPUT"

      - name: Install Node dependencies
        if: steps.inputs.outputs.run == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build the renderer image
        if: steps.inputs.outputs.run == 'true'
        run: npm run renderer:image

      - name: Check the renderer image offline
        if: steps.inputs.outputs.run == 'true'
        run: npm run renderer:smoke

      # The judge's unit tests read Chrome's output for the model cases from a recording
      # (test/fixtures/render/recorded.json); it must be this browser's, of each case as it stands.
      - name: Record the model cases again
        if: steps.inputs.outputs.run == 'true'
        run: npm run renderer:record

      # Every section (src/render/sections.ts: every accepted T case, every model case, and every
      # section of every pinned label) drawn once per ratio and read by every check, each with its
      # own verdict: R3's model against Chrome's computed style; R2's page, R3's fonts and scripts
      # and R6's coverage; R3's character boxes; and R2's second drawing
      # (docs/design/authority-import-renderer.md, Delivery 3c-B and 3c-C1; the model addendum's M4).
      - name: Check every section
        if: steps.inputs.outputs.run == 'true'
        run: npm run renderer:check

      # The seeded refusals of the page, font and box checks, each in every mode it names
      # (docs/design/authority-import-renderer.md, Delivery 3c-B2a).
      - name: Check the seeded refusals
        if: steps.inputs.outputs.run == 'true'
        run: npm run renderer:fonts

      # R3's exact character box: every size form in every pinned face at every ratio, each box
      # the bound face's ascent plus descent and each baseline where the model puts it
      # (docs/design/authority-import-renderer.md, Delivery 3c-C1).
      - name: Check the character box model
        if: steps.inputs.outputs.run == 'true'
        run: npm run renderer:boxes

      # The second drawing's seeded differences and the picture forms
      # (docs/design/authority-import-renderer.md, Delivery 3c-B2b).
      - name: Check the seeded differences of the second drawing
        if: steps.inputs.outputs.run == 'true'
        run: npm run renderer:drawings

  # The worker, query and validator images (audit B07), built from the files Cloud Build builds
  # them from, so a Dockerfile change is proved before the deploy that would first build it. The
  # worker's build asserts its Node, ICU and Unicode; each image's user and command are checked;
  # the validator is started with no network and judged as the Cloud Build step judges it
  # (scripts/ci/build-images.sh). Nothing is pushed and no credential is held; scripts/check-all.sh
  # leaves it out, since it needs Docker and ~250 MB of downloads.
  images:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false

      - name: Build and check the worker, query and validator images
        run: bash scripts/ci/build-images.sh

  zone-a:
    name: Zone A
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
        working-directory: zone-a

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Zone A's version lock test reads main's history as released (LOCK_BASE below).
          fetch-depth: 0
          persist-credentials: false
      # The differential corpus is produced by the TypeScript implementation, so this job needs
      # the Node toolchain as well: the whole point is that the two languages are compared, and
      # a corpus committed to the repository would only prove agreement with a past revision.
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # ADR 0003 pins the Unicode Character Database, and the UCD ships with the
          # interpreter: 3.14 is Unicode 16.0, the same as the Zone B runtime image.
          # tests/test_environment.py asserts this rather than trusting it.
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: zone-a/uv.lock

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Type-check
        run: uv run --frozen mypy --strict

      - name: Check generated models
        run: uv run --frozen python scripts/generate_models.py --check

      # Seed and count are pinned so a failure is reproducible: the same two numbers rebuild the
      # same corpus anywhere. A divergence is reported by case tag, class and digest, never by
      # input text, so a failing CI log still carries no narrative.
      - name: Generate the differential corpus from the TypeScript implementation
        working-directory: .
        run: npx tsx scripts/fidelity/differential.ts --seed 20260920 --count 2000 > differential.jsonl

      # And 2000 cases more at a seed of this run's own, so every run reaches inputs the fixed seed
      # never does. The generator prints the seed and every case records it: a failure here is
      # reproduced anywhere with `--seed <that seed> --count 2000`.
      - name: Add a differential corpus at this run's seed
        working-directory: .
        env:
          DIFFERENTIAL_RUN_SEED: ${{ github.run_id }}
        run: npx tsx scripts/fidelity/differential.ts --seed "$DIFFERENTIAL_RUN_SEED" --count 2000 >> differential.jsonl

      # The history tests/test_versions_lock.py reads as released, as for the importer's lock: a
      # released reader, registry or check version never changes its code.
      - name: Name the version lock's base
        working-directory: .
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci/lock-base.sh

      # Under line coverage, with the floor in zone-a/pyproject.toml [tool.coverage.report].
      - name: Test
        env:
          DIFFERENTIAL_CORPUS: ${{ github.workspace }}/differential.jsonl
        run: uv run --frozen pytest --cov

  agent:
    name: Agent
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
        working-directory: agent

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The highest version google-adk 2.9.2 and Vertex AI Agent Engine both support.
          # agent/README.md "Why 3.14" carries the citations.
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Type-check
        run: uv run --frozen mypy --strict

      # The vendored contracts must equal contracts/generated/query-tools.schema.json and
      # contracts/generated/agent-turn.schema.json byte for byte: the agent ships them because
      # Agent Engine has no repository root, and a second hand-maintained copy would be a
      # second source of truth.
      - name: Check the vendored contracts
        run: uv run --frozen python scripts/sync_contract.py --check

      # The tests stand up the four tools on a real MCP streamable-HTTP server on an ephemeral
      # loopback port and connect the real ADK toolset to it. No model is called. Not wholly
      # hermetic: two deploy-requirement tests resolve against the package index's metadata,
      # and skip (never pass) when it cannot be reached (tests/test_deploy_requirements.py).
      # Under line coverage, with the floor in agent/pyproject.toml [tool.coverage.report].
      - name: Test
        run: uv run --frozen pytest --cov
