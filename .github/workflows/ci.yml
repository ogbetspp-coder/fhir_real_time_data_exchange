name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      # Full history, so test/authority/lock.test.ts can read every importer version main has
      # released; no credentials kept, since npm ci below runs install scripts.
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      # The history test/authority/lock.test.ts reads as released: main's for a pull request, the
      # pre-push commit's for a push; an importer version never changes its code, data or vectors
      # once released (docs/design/authority-import-contract.md, D10).
      - name: Name the importer lock's base
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci/lock-base.sh

      # The test step of `npm run check` is `npm run test:coverage`: the suite under v8 coverage
      # with per-directory floors (vitest.config.ts), so a drop below a floor fails this job.
      - name: Run checks
        run: npm run check

      - name: Build
        run: npm run build

  # The official HL7 validator over the resources a fixture run and an authority import send it, at the pins of
  # Dockerfile.validator (scripts/ci/official-validate.mjs reads the version, URLs, checksums
  # and flags from that file, so this job has no pin of its own). It is its own job rather than
  # part of `npm run check` because it needs a JVM and ~200 MB of downloads; the downloads are
  # cached by the Dockerfile's content, so a pin change is a cache miss and a checksum check.
  # Make this a required check on main once it is green.
  official-validation:
    name: Official validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Keyed by the Dockerfile and the package list: the script verifies every cached tarball
      # against its pinned checksum before use, so a stale or tampered entry is re-downloaded,
      # never trusted. The seeded package cache lives inside this directory too. There is no
      # separate cache of ~/.fhir/packages any more: that one was restored from any earlier key,
      # so on a warm runner it hid every download the validator made and could supply packages
      # nobody had pinned.
      - name: Cache the validator and its packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/official-validator
          key: official-validator-${{ hashFiles('Dockerfile.validator', 'fhir/validator-packages.lock') }}

      - name: Validate the fixture against the official HL7 validator
        run: npm run validate:official

  # The renderer gate's image (docs/design/authority-import-renderer.md, R1's pre-check and R6):
  # built from Dockerfile.renderer, every download checked against its pin and every library
  # Chrome links resolved, then run with no network, a read-only workspace and no credentials, to
  # prove the browser starts offline, loads both modes, fails every request but the page's, and
  # draws every family the fontconfig binds in the pinned face it names. Its own job, since it
  # needs Docker and ~200 MB of downloads; scripts/check-all.sh leaves it out.
  renderer:
    name: Renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the renderer image
        run: npm run renderer:image

      - name: Check the renderer image offline
        run: npm run renderer:smoke

  zone-a:
    name: Zone A
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
        working-directory: zone-a

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The differential corpus is produced by the TypeScript implementation, so this job needs
      # the Node toolchain as well: the whole point is that the two languages are compared, and
      # a corpus committed to the repository would only prove agreement with a past revision.
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # ADR 0003 pins the Unicode Character Database, and the UCD ships with the
          # interpreter: 3.14 is Unicode 16.0, the same as the Zone B runtime image.
          # tests/test_environment.py asserts this rather than trusting it.
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: zone-a/uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Type-check
        run: uv run --frozen mypy --strict

      - name: Check generated models
        run: uv run --frozen python scripts/generate_models.py --check

      # Seed and count are pinned so a failure is reproducible: the same two numbers rebuild the
      # same corpus anywhere. A divergence is reported by case tag, class and digest, never by
      # input text, so a failing CI log still carries no narrative.
      - name: Generate the differential corpus from the TypeScript implementation
        working-directory: .
        run: npx tsx scripts/fidelity/differential.ts --seed 20260920 --count 2000 > differential.jsonl

      - name: Test
        env:
          DIFFERENTIAL_CORPUS: ${{ github.workspace }}/differential.jsonl
        run: uv run --frozen pytest

  agent:
    name: Agent
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
        working-directory: agent

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The highest version google-adk 2.9.2 and Vertex AI Agent Engine both support.
          # agent/README.md "Why 3.14" carries the citations.
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Type-check
        run: uv run --frozen mypy --strict

      # The vendored contracts must equal contracts/generated/query-tools.schema.json and
      # contracts/generated/agent-turn.schema.json byte for byte: the agent ships them because
      # Agent Engine has no repository root, and a second hand-maintained copy would be a
      # second source of truth.
      - name: Check the vendored contracts
        run: uv run --frozen python scripts/sync_contract.py --check

      # Hermetic: the tests stand up the four tools on a real MCP streamable-HTTP server on an
      # ephemeral loopback port and connect the real ADK toolset to it. No model is called.
      # Under line coverage, with the floor in agent/pyproject.toml [tool.coverage.report].
      - name: Test
        run: uv run --frozen pytest --cov
