name: Terraform plan

# Every pull request's infrastructure plan, against live state, before merge (docs/foundations.md,
# B4). The deploy applies unattended on merge, so this is the last point a person sees what an
# infrastructure change will do to the record.
#
# Runs as the read-only planner (scripts/gcp/plan-identity.sh), through its own Workload Identity
# pool: the provider admits this repository's pull_request runs of this file and nothing else,
# and the planner can read metadata and IAM policy but no stored record. The plan cannot take the
# state lock and writes nothing.
#
# The check fails when the plan errors, and when it destroys or replaces anything unless the pull
# request carries the `allow-replace` label: a destroy on merge is applied unattended, so it must
# be acknowledged here first. Adding or removing the label re-runs the check.
#
# A run Dependabot triggers gets a read-only token and cannot request the identity token this
# needs, whatever the pull request touches. Most of its pull requests (npm, uv, base images,
# Actions outside this file) change nothing the plan reads, so for those the check passes without
# planning; the first step names the paths. For one that changes anything else (a provider bump
# in infra/), the check fails and says so: push any commit to its branch as a person and the check
# re-runs under that person.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Nothing at the workflow level: the one job below names what it needs. A grant here would reach
# every job this workflow ever gains, and id-token: write lets any process in a job ask for the
# OIDC token the planner's pool exchanges (test/ci/deploy-permissions.test.ts). The job installs
# no npm packages; if it ever must, it installs with npm_config_ignore_scripts, as the deploy does.
permissions: {}

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    # 20 for the plan, and up to 15 more waiting for a deploy to finish changing live state.
    timeout-minutes: 35
    permissions:
      # To read the deploy workflow's runs (the two deploy-activity steps below).
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    # Every input the deploy passes to deploy.sh is passed here too, job and step alike, so the
    # plan is what applies (test/ci/environment-inputs.test.ts). The environment's own inputs
    # are in scripts/gcp/environments/dev.env, which deploy.sh reads for both.
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      EMA_FLOW_ENVIRONMENT: dev
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The merge commit and both its parents, so the first step can list what the pull
          # request changes against main.
          fetch-depth: 2
          persist-credentials: false

      # A person's run always plans. A Dependabot run plans nothing, and passes only for
      # Dependabot's own pull request from a branch of this repository (not a fork, not a person's
      # pull request Dependabot pushed to) when every path it changes, each side of a rename
      # counted, is one the plan never reads: the npm and uv lockfiles and manifests, the
      # Dockerfiles (the plan uses the images running now), and the other workflows. Anything
      # else, known or not, fails closed with the instruction above.
      - name: Decide whether this run can and must plan
        id: scope
        env:
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$ACTOR" != "dependabot[bot]" ]]; then
            echo "plan=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$AUTHOR" != "dependabot[bot]" || "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "::error::Dependabot's run cannot plan, and this is not Dependabot's own pull request from this repository. Push any commit to its branch as a person; the check re-runs under that person." >&2
            exit 1
          fi
          git rev-parse -q --verify HEAD^2 >/dev/null || { echo "::error::Expected the pull request's merge commit." >&2; exit 1; }
          unread='^(package\.json|package-lock\.json|(agent|zone-a)/(pyproject\.toml|uv\.lock)|Dockerfile(\.[a-z]+)?|\.github/workflows/(ci|deploy|vulnerabilities)\.yml)$'
          # --no-renames: a rename is listed as its deletion and its addition, so moving a file the
          # plan reads to an allowed name still names the path it left.
          read="$(git diff --no-renames --name-only HEAD^1 HEAD | grep -Ev "$unread" || true)"
          if [[ -n "$read" ]]; then
            echo "::error::Dependabot's run cannot plan, and this pull request changes what the plan may read: ${read//$'\n'/, }. Push any commit to its branch as a person; the check re-runs under that person." >&2
            exit 1
          fi
          echo "A Dependabot pull request that changes nothing the plan reads: no plan needed."
          echo "plan=false" >>"$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud as the planner
        if: steps.scope.outputs.plan == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        if: steps.scope.outputs.plan == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        # Pinned (audit B07, S-2): unpinned, every run installed the newest Cloud SDK, whose
        # `storage rsync` and `builds submit` behaviour the deploy scripts depend on. The weekly
        # pin-freshness workflow reports a newer release; test/ci/pin-freshness.test.ts holds the two
        # workflows to one version.
        with:
          version: "586.0.0"
      - name: Set up Terraform
        if: steps.scope.outputs.plan == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Terraform init
        if: steps.scope.outputs.plan == 'true'
        run: bash scripts/gcp/deploy.sh init

      # A plan taken while a deploy changes live state proposes reverting that deploy (#141's plan
      # proposed the query and worker images of 75e3128). The plan does not join the deploy's
      # concurrency group, where a queued plan would cancel a queued deploy. Instead, before it
      # plans, it waits up to 15 minutes for any deploy that is changing live state to finish, and
      # after it plans, it fails if a deploy began or went on changing live state meanwhile, with
      # the warning at the top of the summary (scripts/ci/workflow-runs.mjs, deploy-activity).
      - name: Set up Node.js
        if: steps.scope.outputs.plan == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      # If it waits in vain, it writes the summary itself, saying no plan was taken, so the pull
      # request's plan comment is replaced rather than left showing an older plan as current.
      - name: Wait for any deploy changing live state
        id: before
        if: steps.scope.outputs.plan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_SUMMARY: ${{ runner.temp }}/plan-summary.md
        run: node scripts/ci/workflow-runs.mjs deploy-activity --since now --wait-minutes 15

      - name: Plan against live state
        id: plan
        if: steps.scope.outputs.plan == 'true'
        env:
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          QUERY_INVOKERS: ${{ vars.QUERY_INVOKERS }}
          QUERY_TOKEN_CREATORS: ${{ vars.QUERY_TOKEN_CREATORS }}
          QUERY_ENTITLEMENTS_JSON: ${{ vars.QUERY_ENTITLEMENTS_JSON }}
          QUERY_OAUTH_CLIENT_IDS: ${{ vars.QUERY_OAUTH_CLIENT_IDS }}
          # As the deploy passes them: not to dev, whose alerts page no one (deploy.yml).
          ALERT_NOTIFICATION_EMAIL: ${{ env.EMA_FLOW_ENVIRONMENT != 'dev' && vars.ALERT_NOTIFICATION_EMAIL || '' }}
          ALERT_NOTIFICATION_CHANNELS: ${{ env.EMA_FLOW_ENVIRONMENT != 'dev' && vars.ALERT_NOTIFICATION_CHANNELS || '' }}
          ALLOW_REPLACE: ${{ contains(github.event.pull_request.labels.*.name, 'allow-replace') }}
          PLAN_OUT: ${{ runner.temp }}/plan.txt
          PLAN_SUMMARY: ${{ runner.temp }}/plan-summary.md
        run: bash scripts/gcp/deploy.sh plan

      # Whether the plan succeeded or not: a destroy it reports may be the overlap's doing.
      - name: Check no deploy changed live state during the plan
        if: ${{ !cancelled() && steps.before.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.before.outputs.since }}
          PLAN_SUMMARY: ${{ runner.temp }}/plan-summary.md
        run: node scripts/ci/workflow-runs.mjs deploy-activity --since "$SINCE"

      # The summary holds resource addresses and actions only (scripts/ci/plan-summary.py). The
      # full plan text is never published: it carries attribute values, including account ids.
      - name: Post the summary to the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SUMMARY: ${{ runner.temp }}/plan-summary.md
        run: |
          [[ -f "$SUMMARY" ]] || { echo "No summary: the plan did not run."; exit 0; }
          cat "$SUMMARY" >>"$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --edit-last --create-if-none --body-file "$SUMMARY"
