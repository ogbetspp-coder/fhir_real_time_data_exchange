main:
  params: [args]
  steps:
    - initialise:
        assign:
          - runId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
          - serviceUrl: ${sys.get_env("EMA_FLOW_SERVICE_URL")}
          # Required: there is no default source. The old default, healthcare-api, is an ungated
          # source that production disables, so an execution without one failed late, at the worker.
          - sourceKind: ${map.get(args, "source")}
          - bundleId: ${map.get(args, "bundleId")}
          - submissionRef: ${map.get(args, "submissionRef")}
    - requireSource:
        switch:
          - condition: ${sourceKind == null}
            raise: "The workflow requires a source argument: document, healthcare-api or fixture"
    - buildRequest:
        assign:
          - requestBody:
              source: ${sourceKind}
              runId: ${runId}
    # A document run carries only the hash-pinned reference; the submission itself stays in the
    # submission bucket and never transits the workflow body or its execution history.
    - addSourceReference:
        switch:
          - condition: ${sourceKind == "healthcare-api"}
            assign:
              - requestBody.bundleId: ${bundleId}
          - condition: ${sourceKind == "document"}
            assign:
              - requestBody.submissionRef: ${submissionRef}
    - logStart:
        call: sys.log
        args:
          severity: INFO
          json:
            message: "Starting ePI interoperability workflow"
            runId: ${runId}
            stage: "orchestration"
            source: ${sourceKind}
    - executeDeterministicPipeline:
        call: http.post
        args:
          url: ${serviceUrl + "/v1/runs"}
          auth:
            type: OIDC
            audience: ${serviceUrl}
          timeout: 1800
          body: ${requestBody}
        result: pipelineResponse
    # The stream check looks for the version this run wrote, not for the Bundle id: the id is the
    # same across every version of a label, so a row from an earlier version used to satisfy it.
    - requirePersistedVersion:
        switch:
          - condition: ${pipelineResponse.body.status != "persisted" or map.get(pipelineResponse.body, "targetBundleVersionId") == null}
            raise: "The pipeline reported no persisted version of the document Bundle, so its stream cannot be checked"
    - initialiseStreamCheck:
        assign:
          - attempts: 0
          - streamObserved: false
    - checkBigQueryStream:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          body:
            useLegacySql: false
            timeoutMs: 10000
            query: ${"SELECT id, meta.lastUpdated AS last_updated FROM `" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + "." + sys.get_env("EMA_FLOW_BIGQUERY_DATASET") + ".Bundle` WHERE id = @bundle_id AND meta.versionId = @version_id LIMIT 1"}
            parameterMode: NAMED
            queryParameters:
              - name: bundle_id
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${pipelineResponse.body.targetBundleId}
              - name: version_id
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${pipelineResponse.body.targetBundleVersionId}
        result: streamQuery
    - evaluateStreamCheck:
        assign:
          - attempts: ${attempts + 1}
          - streamObserved: ${default(streamQuery.totalRows, "0") != "0"}
    - waitForStream:
        switch:
          - condition: ${not(streamObserved) and attempts < 12}
            steps:
              - wait:
                  call: sys.sleep
                  args:
                    seconds: 10
              - retry:
                  next: checkBigQueryStream
          - condition: ${not(streamObserved)}
            raise: ${"FHIR write succeeded but BigQuery Bundle view was not current after " + string(attempts * 10) + " seconds"}
    - logComplete:
        call: sys.log
        args:
          severity: INFO
          json:
            message: "ePI interoperability workflow completed"
            runId: ${runId}
            stage: "orchestration"
            status: ${pipelineResponse.body.status}
            bigQueryStreamObserved: ${streamObserved}
            bigQueryLagUpperBoundSeconds: ${attempts * 10}
    - complete:
        return:
          runId: ${runId}
          pipeline: ${pipelineResponse.body}
          bigQueryStreamObserved: ${streamObserved}
          bigQueryLagUpperBoundSeconds: ${attempts * 10}
