[project]
name = "verifiable-answer-agent"
version = "0.1.0"
description = "Roadmap item 1b: the verifiable-answer agent. Calls the ePI query service's four MCP tools, composes answers deterministically from their results, re-checks every verbatim block through verify_quote, and emits one narrative-free audit record per turn."
readme = "README.md"
# The highest version google-adk and Vertex AI Agent Engine both support today, which is 3.14.
# google-adk 2.9.2 declares `requires_python >=3.10` and classifies 3.10-3.14; Agent Engine's
# `AgentEngineConfig.python_version` enumerates "3.10", "3.11", "3.12", "3.13", "3.14" and
# defaults to 3.10, so the deploy script sets it explicitly rather than inheriting a default
# that is four minors behind this lock. README.md "Why 3.14" carries the citations and the
# caveat. The range is closed because a different minor is a different Agent Engine runtime
# image, and because `uv.lock` is resolved for one interpreter.
requires-python = ">=3.14,<3.15"
# The `mcp` extra is not optional for this agent: `google-adk` 2.9.2 keeps the Model Context
# Protocol SDK behind `google-adk[mcp]` (`mcp>=1.24,<2`), and `McpToolset` is the whole of
# requirement (1). `uv.lock` pins the resolved `mcp` exactly.
dependencies = ["google-adk[mcp]==2.11.0", "jsonschema==4.26.0", "pydantic==2.13.5"]

[dependency-groups]
dev = [
  # A CommonMark renderer (the Python port of markdown-it), for the test that the answer shows
  # each quotation verbatim once rendered as Markdown (tests/test_render.py). Tests only.
  "markdown-it-py==4.2.0",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.10",
  "types-jsonschema==4.26.0.20260518",
  "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv]
# The build backend and its whole closure, pinned (audit B07, S-5). `uv sync` builds this project
# with hatchling, and hatchling's own dependencies were resolved afresh on every sync, unpinned:
# a new release of any of them reached CI and every developer's machine with no review. uv takes
# no hashes for build dependencies in project mode, so these are exact versions, checked against
# the index's hashes as they download; test/ci/python-build-pins.test.ts holds the hatchling pin
# equal to [build-system] and the list to hatchling's dependencies. A Dependabot move of
# [build-system] fails `uv sync` until this list moves with it (then `uv lock`).
build-constraint-dependencies = [
  "hatchling==1.32.4",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.9.21.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verifiable_answer_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "deploy"]
target-version = "py314"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "PIE",
  "PT",
  "RET",
  "SIM",
  "ARG",
  "PTH",
  "ERA",
  "RUF",
  "T20",
  # Google Python Style Guide (docs/python-style.md): no assert outside tests (it
  # is stripped under -O), no blind except, pylint's error and warning checks, and Google
  # docstrings.
  "S101",
  "BLE",
  "PLE",
  "PLW",
  "PLC1802",
  "D",
]
# An __init__ is documented in its class's docstring (Google style).
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# The deploy script and the contract sync script are operator tools: they report to a terminal.
# Nothing they print is ever a tool result, and tests/test_no_narrative_leak.py proves it by
# refusing any print anywhere under src/.
"deploy/*.py" = ["T201"]
"scripts/*.py" = ["T201"]
# Tests assert (pytest), and a test's name is its documentation.
"tests/*.py" = ["S101", "D"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts", "deploy"]
mypy_path = "src"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# The Vertex AI SDK is a DEPLOY-time dependency and is deliberately absent from uv.lock: it
# pulls the whole Google Cloud client stack, none of which the agent runs, and nothing in CI
# executes deploy/. The import is lazy and guarded, so the module is declared missing rather
# than installed to satisfy the type checker. Everything the agent actually runs is checked.
module = ["agentplatform", "agentplatform.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Line coverage of the deployable, enforced in CI by `uv run --frozen pytest --cov` (the agent
# job in .github/workflows/ci.yml). Not in addopts, so running one test file locally does not
# fail on the floor. The floor is the coverage measured on 2026-09-22 (98.61%), rounded down:
# raise it when coverage rises, never lower it to let a change through.
[tool.coverage.run]
source = ["verifiable_answer_agent"]

[tool.coverage.report]
fail_under = 98
precision = 2
show_missing = true
skip_covered = true
