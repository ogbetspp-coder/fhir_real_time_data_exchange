options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: europe-west4
  _REPOSITORY: ema-flow-images
  _IMAGE_TAG: manual

steps:
  - id: build-app-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/worker:${_IMAGE_TAG}
      - .

  - id: build-validator-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - Dockerfile.validator
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/validator:${_IMAGE_TAG}
      - .

  # The validator image must start with no network at all (docs/foundations.md, C9). Its
  # packages are installed at build time and its JVM has no route out, so this proves on every
  # build that the deployed sidecar needs nothing from the internet to become ready. Bash
  # variables are written $$name so Cloud Build does not read them as substitutions.
  - id: validator-starts-offline
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/validator:${_IMAGE_TAG}"
        docker run --detach --name offline --network none "$$image" >/dev/null
        started=""
        for attempt in $$(seq 1 120); do
          if docker logs offline 2>&1 | grep -q "FHIR Validator HTTP Service started"; then
            started="yes"
            break
          fi
          if [ "$$(docker inspect --format '{{.State.Running}}' offline)" != "true" ]; then
            break
          fi
          sleep 2
        done
        docker logs offline > offline.log 2>&1 || true
        docker rm --force offline >/dev/null
        # An install means a needed package is not in the image. A fetch error that the
        # validator's own -no-http-access policy did not refuse means an attempt got as far as a
        # socket. Refused optional lookups (the hl7.terminology version check) are allowed.
        if grep -E "Installing [^ ]+ to the package cache" offline.log; then
          echo "The validator needed a package that is not installed in the image." >&2
          exit 1
        fi
        # Refused before any socket: the policy message, or a bare "Failed to determine latest
        # version of package <id> from server: <server>" (the engine's hl7.terminology lookup,
        # which falls back to the pinned package). Anything else is a real attempt.
        if grep -E "Error fetching|Failed to determine latest version of package|Failed to connect" offline.log \
          | grep -Ev "not allowed by local security policy|Failed to determine latest version of package [^ ]+ from server: [^ ]+[[:space:]]*$"; then
          echo "The validator attempted a network request that its policy did not refuse." >&2
          exit 1
        fi
        if [ -z "$$started" ]; then
          tail -40 offline.log >&2
          echo "The validator did not start with networking disabled." >&2
          exit 1
        fi
        grep -q "Jurisdiction: Global (Whole world)" offline.log \
          || { echo "The validator is not validating under universal jurisdiction." >&2; exit 1; }
        grep -q "Locale: United States/US" offline.log \
          || { echo "The validator is not running in the pinned locale." >&2; exit 1; }
        grep -E "Jurisdiction:|Locale:|Package Summary|HTTP Service started" offline.log | cut -c1-200

  - id: build-query-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - Dockerfile.query
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/query:${_IMAGE_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/worker:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/validator:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/query:${_IMAGE_TAG}
